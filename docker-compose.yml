# Simple docker-compose for local demo
version: '3.8'
services:
  backend:
    build: ./packages/backend
    command: node src/index.js
    ports:
      - "5000:5000"
    volumes:
      - ./packages/backend:/app
    working_dir: /app
    environment:
      - PORT=5000

  # Frontend requires Next.js dev server which runs on your machine with `yarn dev`.

